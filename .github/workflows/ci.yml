name: 项目质量检查

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: 仓库卫生检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 检查生成物、凭据与编码残留
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/check_repository_hygiene.py

  python-tests:
    name: Python 回归（${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: 安装运行依赖
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-runtime.txt
      - name: 运行 Python 回归
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -p "test_*.py"

  web-build:
    name: Web 前端构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - name: 安装前端依赖
        run: npm --prefix web-app ci --no-audit --no-fund
      - name: 构建 Web 前端
        run: npm --prefix web-app run build

  docker-build:
    name: Docker 镜像构建
    needs: [repository-hygiene, python-tests, web-build]
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 构建 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: fyt-data-mgmt:ci
